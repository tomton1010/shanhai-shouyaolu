<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>山海收妖录</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230e0d0c'/%3E%3Crect x='7' y='2' width='2' height='12' fill='%23c44536'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        position: fixed;
        inset: 0;
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        text-size-adjust: 100%;
        -webkit-text-size-adjust: 100%;
        background: #0e0d0c;
      }

      #game,
      #game canvas {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      #game {
        width: 100%;
        height: 100%;
      }

      #level-up {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 20px;
        box-sizing: border-box;
        background: rgba(8, 7, 6, 0.9);
        color: #cbbfaa;
        font-family: "WenQuanYi Micro Hei", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      #level-up[hidden],
      #run-end[hidden] {
        display: none !important;
      }

      #run-end {
        position: fixed;
        inset: 0;
        z-index: 21;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        box-sizing: border-box;
        background: rgba(8, 7, 6, 0.92);
        color: #cbbfaa;
        font-family: "WenQuanYi Micro Hei", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      #run-end-title {
        margin: 0;
        font-size: 36px;
        letter-spacing: 0.24em;
      }

      #run-end-detail {
        margin: 0;
        font-size: 22px;
        color: #d7cbb6;
      }

      #run-end-again {
        min-width: 220px;
        min-height: 64px;
        padding: 0 28px;
        border: 1px solid #3a342c;
        background: #161311;
        color: #cbbfaa;
        font: inherit;
        font-size: 24px;
        letter-spacing: 0.12em;
        cursor: pointer;
      }

      .level-up-title {
        margin: 0;
        font-size: 22px;
        letter-spacing: 0.2em;
      }

      .cards {
        display: flex;
        gap: 14px;
        width: min(980px, 100%);
      }

      .card,
      #level-up-reroll {
        border: 1px solid #3a342c;
        background: #161311;
        color: #cbbfaa;
        font: inherit;
        text-align: left;
      }

      .card {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 148px;
        padding: 16px 16px 14px;
        cursor: pointer;
      }

      .card-key {
        color: #8d8374;
        font-size: 14px;
      }

      .card-name {
        font-size: 26px;
      }

      .card-detail {
        font-size: 18px;
        color: #d7cbb6;
      }

      .card-stack {
        margin-top: auto;
        color: #8d8374;
        font-size: 15px;
      }

      #level-up-reroll {
        min-width: 180px;
        min-height: 48px;
        padding: 0 18px;
        text-align: center;
        cursor: pointer;
      }

      #level-up-reroll:disabled {
        opacity: 0.45;
        cursor: default;
      }

      @media (orientation: portrait) {
        .cards {
          flex-direction: column;
        }

        .card {
          min-height: 92px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="level-up" hidden>
      <p class="level-up-title">选择符箓</p>
      <div class="cards" id="level-up-cards"></div>
      <button type="button" id="level-up-reroll">重画</button>
    </div>
    <div id="run-end" hidden>
      <p id="run-end-title"></p>
      <p id="run-end-detail"></p>
      <button type="button" id="run-end-again">再来一局</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
